site_name: Corso Tabular Foundation Model
site_description: Materiale didattico per due corsi sui Tabular Foundation Model - usarli e costruirne uno da zero.
site_author: Emanuele Buchicchio

# Da compilare dopo aver creato il repository su GitHub:
# site_url: https://<utente>.github.io/<repository>/
# repo_url: https://github.com/<utente>/<repository>
# repo_name: <utente>/<repository>

docs_dir: docs
copyright: "&copy; 2026 Emanuele Buchicchio"

theme:
  name: material
  language: it
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.footer
    - navigation.top
    - toc.follow
    - content.code.copy
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Passa al tema scuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Passa al tema chiaro
  icon:
    logo: material/table-large

plugins:
  - search:
      lang: it

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.arithmatex:
      generic: true

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

nav:
  - Home: index.md
  - "Corso 1 · Usare un TFM":
      - usare-tfm/index.md
      - "Modulo 0 · Setup": usare-tfm/modulo-0-setup.md
      - "Modulo 1 · Teoria": usare-tfm/modulo-1-teoria.md
      - "Modulo 2 · Esempi didattici": usare-tfm/modulo-2-esempi-didattici.md
      - "Modulo 3 · Caso realistico": usare-tfm/modulo-3-caso-realistico.md
      - "Modulo 4 · TFM come tool di un agente": usare-tfm/modulo-4-agente-llm.md
      - "Modulo 5 · Verifica e chiusura": usare-tfm/modulo-5-verifica.md
      - Ambiente e hardware: usare-tfm/ambiente.md
      - Riferimenti: usare-tfm/riferimenti.md
  - "Corso 2 · Costruire un TFM":
      - costruire-tfm/index.md
      - "Modulo 0 · Setup": costruire-tfm/modulo-0-setup.md
      - "Modulo 1 · Inferenza ammortizzata": costruire-tfm/modulo-1-inferenza-ammortizzata.md
      - "Modulo 2 · Il prior": costruire-tfm/modulo-2-prior.md
      - "Modulo 3 · Il modello": costruire-tfm/modulo-3-modello.md
      - "Modulo 4 · L'addestramento": costruire-tfm/modulo-4-addestramento.md
      - "Modulo 5 · Valutazione e ablation": costruire-tfm/modulo-5-valutazione-ablation.md
      - "Modulo 6 · Verifica e chiusura": costruire-tfm/modulo-6-verifica.md
      - Ambiente e budget di calcolo: costruire-tfm/ambiente.md
      - Riferimenti: costruire-tfm/riferimenti.md
